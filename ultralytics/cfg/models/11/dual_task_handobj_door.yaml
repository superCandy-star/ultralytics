# YOLO11 Dual-Task model: Two independent necks + heads sharing backbone.
# Phase 1: train backbone + Neck A + Head A (hand+obj)
# Phase 2: train backbone + Neck B + Head B (virtual door)
# Phase 3: fine-tune all together

# Parameters
nc: [2, 4]  # [hand+obj=2, cabinet+junction+side_cabinet+box=4]
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Shared backbone (same as yolo11.yaml, indices 0-10)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4 = P3 (stride 8)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]         # 6 = P4 (stride 16)
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]             # 10 = P5 (stride 32)

head:
  # ====== Neck A (indices 11-22, hand+obj detection) ======
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11: upsample P5
  - [[-1, 6], 1, Concat, [1]]                           # 12
  - [-1, 2, C3k2, [512, False]]                         # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]          # 14
  - [[-1, 4], 1, Concat, [1]]                           # 15
  - [-1, 2, C3k2, [256, False]]                         # 16: Neck A P3
  - [-1, 1, Conv, [256, 3, 2]]                          # 17
  - [[-1, 13], 1, Concat, [1]]                          # 18
  - [-1, 2, C3k2, [512, False]]                         # 19: Neck A P4
  - [-1, 1, Conv, [512, 3, 2]]                          # 20
  - [[-1, 10], 1, Concat, [1]]                          # 21
  - [-1, 2, C3k2, [1024, True]]                         # 22: Neck A P5
  - [[16, 19, 22], 1, Detect, [2]]                      # 23: Head A (hand, obj)

  # ====== Neck B (indices 24-35, virtual door detection, independent weights) ======
  # Neck B reads backbone features directly via explicit indices
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]          # 24: upsample P5 from backbone
  - [[24, 6], 1, Concat, [1]]                            # 25
  - [-1, 2, C3k2, [512, False]]                          # 26
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 27
  - [[27, 4], 1, Concat, [1]]                            # 28
  - [-1, 2, C3k2, [256, False]]                          # 29: Neck B P3
  - [-1, 1, Conv, [256, 3, 2]]                           # 30
  - [[30, 26], 1, Concat, [1]]                           # 31
  - [-1, 2, C3k2, [512, False]]                          # 32: Neck B P4
  - [-1, 1, Conv, [512, 3, 2]]                           # 33
  - [[33, 10], 1, Concat, [1]]                           # 34
  - [-1, 2, C3k2, [1024, True]]                          # 35: Neck B P5
  - [[29, 32, 35], 1, Detect, [4]]                       # 36: Head B (cabinet, junction, side_cabinet, box)
